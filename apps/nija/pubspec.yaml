name: nija
description: Cross-platform clipboard history synced through your own database.
publish_to: none
version: 0.4.2+7
repository: https://github.com/appfide/nija

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  clipboard_watcher: ^0.3.0
  clock: ^1.1.2
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.1
  hotkey_manager: ^0.2.3
  intl: ^0.20.2
  logger: ^2.8.0
  mobile_scanner: ^7.4.2
  nija_core:
    path: ../../packages/nija_core
  pasteboard: ^0.5.0
  path: ^1.9.0
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.5
  tray_manager: ^0.5.3
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  win32: ^6.4.0
  win32_registry: ^3.0.3
  window_manager: ^0.5.2

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.35.0
  flutter_test:
    sdk: flutter
  sqlite3: ^3.5.2
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/fonts/OFL-Inter.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    # Inter ships no Devanagari. The About page writes the app's name in its
    # own script, so the glyphs travel with the app instead of depending on
    # whatever the host OS happens to have installed.
    - family: Noto Sans Devanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
          weight: 400
