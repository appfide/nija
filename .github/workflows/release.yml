name: Release

# Every push to main that bumps `version:` in apps/nija/pubspec.yaml
# creates tag v<version>, builds every installer and publishes a GitHub
# Release. Pushing a v* tag manually (or workflow_dispatch) does the same.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# A release must never race another one: both would push tags and upload into
# the same release. Queue instead of cancelling, so a started build finishes.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.5"
  APP_DIR: apps/nija
  ARTIFACT_NAME: "Nija-{{build_name}}-{{platform}}.{{ext}}"

jobs:
  # ---------------------------------------------------------------------------
  version:
    name: Resolve version / create tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: v
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^version:\s*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' "$APP_DIR/pubspec.yaml")
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"
          echo "release=true" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.target }}
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   target: macos,   platform: macos,   targets: dmg }
          - { os: macos-latest,   target: ios,     platform: ios,     targets: ipa }
          - { os: windows-latest, target: windows, platform: windows, targets: "exe,zip" }
          - { os: ubuntu-latest,  target: linux,   platform: linux,   targets: "deb,appimage" }
          - { os: ubuntu-latest,  target: android, platform: android, targets: "apk,aab" }
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Job level, so the signing steps can test these in their own `if`.
      MACOS_SIGNING: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
      ANDROID_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        if: runner.os == 'Linux'
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Linux build + packaging deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libx11-dev libxi-dev libsecret-1-dev libkeybinder-3.0-dev \
            libfuse2 dpkg-dev fakeroot plocate xvfb
          # The AppImage maker resolves bundled .so files with `locate`.
          sudo updatedb
          curl -sSL -o /usr/local/bin/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool

      - name: macOS packaging deps (appdmg)
        if: matrix.target == 'macos'
        run: npm install -g appdmg

      - name: Android signing key (optional)
        if: matrix.target == 'android' && env.ANDROID_SIGNING == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$APP_DIR/android/upload-keystore.jks"
          cat > "$APP_DIR/android/key.properties" <<EOT
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOT
          echo "Release keystore configured."

      - name: macOS Developer ID keychain (optional)
        if: matrix.target == 'macos' && env.MACOS_SIGNING == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          # Fail here rather than after a 20-minute build if the set is partial.
          missing=""
          # Notarization signs in with an App Store Connect API key when one
          # is set, otherwise with an Apple ID and app-specific password.
          if [ -n "${APPLE_API_KEY_P8:-}" ]; then
            notary="APPLE_API_KEY_ID APPLE_API_ISSUER_ID"
          else
            notary="APPLE_ID APPLE_APP_PASSWORD"
          fi
          for name in MACOS_CERT_PASSWORD APPLE_TEAM_ID $notary; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Signing is on but these secrets are empty:$missing"
            exit 1
          fi

          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          echo "$MACOS_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Lets codesign use the key without a UI prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain"
          rm -f "$RUNNER_TEMP/cert.p12"

          identity=$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/ { print $2; exit }')
          if [ -z "$identity" ]; then
            echo "::error::No Developer ID Application identity in MACOS_CERT_P12_BASE64."
            exit 1
          fi
          echo "Signing as: $identity"
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

          # Read by macos/Runner/Configs/Release.xcconfig; gitignored.
          {
            echo "CODE_SIGN_STYLE = Manual"
            echo "CODE_SIGN_IDENTITY = Developer ID Application"
            echo "DEVELOPMENT_TEAM = $APPLE_TEAM_ID"
            echo "ENABLE_HARDENED_RUNTIME = YES"
            echo "OTHER_CODE_SIGN_FLAGS = --timestamp"
          } > "$APP_DIR/macos/Runner/Configs/Signing.xcconfig"

      - name: Install flutter_distributor
        shell: bash
        run: dart pub global activate flutter_distributor

      - name: Package (${{ matrix.targets }})
        if: matrix.target != 'ios'
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          flutter pub get
          # `dart pub global run` avoids PATH differences between runners.
          dart pub global run flutter_distributor:main package \
            --platform "${{ matrix.platform }}" \
            --targets "${{ matrix.targets }}" \
            --artifact-name "$ARTIFACT_NAME" \
            --build-dart-define "APP_VERSION=$VERSION" \
            --build-dart-define "GIT_SHA=${GITHUB_SHA::7}"

      - name: Build unsigned iOS ipa
        if: matrix.target == 'ios'
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          flutter pub get
          flutter build ios --release --no-codesign \
            --dart-define "APP_VERSION=$VERSION" --dart-define "GIT_SHA=${GITHUB_SHA::7}"
          mkdir -p dist/ios/Payload
          cp -R build/ios/iphoneos/Runner.app dist/ios/Payload/
          (cd dist/ios && zip -qr "Nija-$VERSION-ios-unsigned.ipa" Payload)
          rm -rf dist/ios/Payload

      - name: Notarize and staple the dmg
        if: matrix.target == 'macos' && env.MACOS_SIGNING == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          app="$APP_DIR/build/macos/Build/Products/Release/Nija.app"
          codesign --verify --strict --verbose=2 "$app"
          codesign --display --verbose=4 "$app" 2>&1 | grep -E 'Authority|TeamIdentifier|flags'

          dmg=$(find "$APP_DIR/dist" -name '*.dmg' -print -quit)
          if [ -z "$dmg" ]; then
            echo "::error::No dmg to notarize."
            exit 1
          fi
          codesign --force --timestamp --sign "$SIGN_IDENTITY" "$dmg"

          # Apple rejects the submission silently in some failure modes, so read
          # the status back and pull the log when it is anything but Accepted.
          if [ -n "${APPLE_API_KEY_P8:-}" ]; then
            key="$RUNNER_TEMP/AuthKey.p8"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
            auth=(--key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID")
          else
            auth=(--apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD")
          fi
          xcrun notarytool submit "$dmg" "${auth[@]}" \
            --wait --output-format json > "$RUNNER_TEMP/notary.json"
          cat "$RUNNER_TEMP/notary.json"
          status=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$RUNNER_TEMP/notary.json")
          if [ "$status" != "Accepted" ]; then
            submission=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$RUNNER_TEMP/notary.json")
            xcrun notarytool log "$submission" "${auth[@]}" || true
            echo "::error::Notarization returned $status."
            exit 1
          fi

          rm -f "$RUNNER_TEMP/AuthKey.p8"
          xcrun stapler staple "$dmg"
          # What Gatekeeper will do on the user's machine.
          spctl --assess --type open --context context:primary-signature -vv "$dmg"

      - name: Verify packaged artifacts
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify_artifacts.sh \
            "${{ matrix.platform }}" "$VERSION" "$APP_DIR/dist"

      # Verification proves the installer holds the right app; this proves the
      # app starts. A build that cannot find a library or dies initialising
      # its database exits within a second, and nothing else would notice.
      - name: Smoke launch
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/smoke_launch.sh "${{ matrix.platform }}" "$APP_DIR/dist"

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          find "$APP_DIR/dist" -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.zip' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.apk' -o -name '*.aab' -o -name '*.ipa' \) -exec cp {} out/ \;
          ls -la out

      - name: Remove signing material
        if: always() && matrix.target == 'macos'
        run: |
          set -euo pipefail
          rm -f "$APP_DIR/macos/Runner/Configs/Signing.xcconfig"
          if [ -n "${SIGN_KEYCHAIN:-}" ]; then
            security delete-keychain "$SIGN_KEYCHAIN" || true
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  publish:
    name: Publish GitHub Release
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Provenance is signed through the job's OIDC identity, not a stored key.
      id-token: write
      attestations: write
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      # Built here rather than by a scanner action: the repository restricts
      # which Actions may run, and that allowlist is worth more than the
      # convenience of pulling in a third-party one.
      - name: Software bill of materials
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/generate_sbom.py "$VERSION" \
            "artifacts/nija-$VERSION-sbom.spdx.json"

      - name: Checksums
        run: |
          cd artifacts
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Ties every installer to this workflow, this commit and this runner.
      # `gh attestation verify <file> --repo <owner>/<repo>` checks one.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*

      - name: Release notes header
        env:
          MACOS_SIGNED: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          docs=https://github.com/appfide/nija/blob/main/docs/release.md
          {
            if [ "$MACOS_SIGNED" = "true" ]; then
              echo "The macOS dmg is signed with a Developer ID and notarized by Apple; open it normally."
              echo "Windows builds are unsigned: SmartScreen → *More info* → *Run anyway*."
            else
              echo "Unsigned builds: see [docs/release.md]($docs#installing-unsigned-builds) for Gatekeeper / SmartScreen steps."
            fi
            echo "Verify downloads with \`SHA256SUMS.txt\`, and their origin with"
            echo "\`gh attestation verify <file> --repo ${GITHUB_REPOSITORY}\`."
            echo "An SPDX bill of materials ships with the release."
          } > notes.md

          # Lead with this version's CHANGELOG section: hand-written notes beat
          # a list of commit subjects, and the file is the release's own record.
          python3 scripts/changelog_section.py "$VERSION" >> notes.md || true
          cat notes.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Nija ${{ needs.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
          body_path: notes.md
