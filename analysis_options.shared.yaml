# Shared analysis options: workspace packages `include` this file.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Anything the analyzer flags is a build failure in CI.
    todo: info
    deprecated_member_use: warning
    missing_required_param: error
    missing_return: error
    invalid_use_of_protected_member: error
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.drift.dart"
    - "**/generated/**"
    - "build/**"

linter:
  rules:
    avoid_print: true
    avoid_dynamic_calls: true
    prefer_final_locals: true
    unawaited_futures: true
    always_declare_return_types: true
    cancel_subscriptions: true
    close_sinks: true
    only_throw_errors: true
    prefer_single_quotes: true
    sort_pub_dependencies: true
    # Relaxed: adapters must catch-all to wrap third-party errors; line length is handled by `dart format`.
    avoid_catches_without_on_clauses: false
    prefer_constructors_over_static_methods: false
    lines_longer_than_80_chars: false
    public_member_api_docs: false
